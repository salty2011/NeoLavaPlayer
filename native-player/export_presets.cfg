[preset.0]
name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="*.lvo,*.LVO,*.lvd,*.LVD,*.lvm,*.LVM,*.ashex,*.lvc,*.ini,*.mp3,*.script,*.mrq,*.pod,*.json,bin/oozic-music-helper"
exclude_filter="test-data/*"
export_path="../builds/Oozic Recovery Player.app"
[preset.0.options]
application/icon="res://icon.png"
export/distribution_type=0
binary_format/architecture="universal"
application/bundle_identifier="local.oozic.recoveryplayer"
application/short_version="0.1.0"
application/version="0.1.0"
application/min_macos_version="12.0"
codesign/codesign=1
codesign/identity=""
codesign/entitlements/apple_events=true
application/additional_plist_content="<key>NSAppleMusicUsageDescription</key><string>Oozic reads your Music library so you can add your songs and playlists to the player.</string><key>NSAudioCaptureUsageDescription</key><string>Oozic listens to the Music app's audio so the visualiser can react to the songs it plays.</string><key>NSAppleEventsUsageDescription</key><string>Oozic controls the Music app to play, pause, seek and skip the songs you choose.</string>"
